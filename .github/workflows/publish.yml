name: Publish to PyPI

# Triggered by a `v*` tag, e.g. `git tag v0.1.0 && git push --tags`.
# Uses Trusted Publishing (OIDC): create the `tickerkit` project on PyPI and add a
# "publishing" environment in this repo with the PyPI OIDC publisher configured, then
# this workflow publishes with no stored secret.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: verify version matches tag
        run: |
          uv run python -c \
            "import sys, tomllib; v = tomllib.load(open('pyproject.toml','rb'))['project']['version']; \
             assert 'v' + v == '${{ github.ref_name }}', f'tag {github.ref_name} != project version {v}'"
      - name: build artefacts
        run: uv build
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1