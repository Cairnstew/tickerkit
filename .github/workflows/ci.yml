name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: sync (locked)
        run: uv sync --locked --group dev
      - name: ruff
        run: uv run ruff check src/ tests/ examples/ tools/
      - name: offline test suite
        # The `live` markers hit free public APIs by hand and are excluded on CI.
        run: uv run python -m pytest -m "not live"

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: uv build
        run: uv build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error